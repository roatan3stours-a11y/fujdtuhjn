<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IP-800 interactivo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef2f5; color: #17212b; }
    header { padding: 16px 20px; background: #174a63; color: #fff; }
    header h1 { margin: 0; font-size: 20px; }
    main { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 18px; max-width: 1400px; margin: 18px auto; padding: 0 18px; }
    .panel { padding: 18px; background: #fff; border: 1px solid #d5dde3; border-radius: 6px; }
    .panel h2 { margin: 0 0 16px; font-size: 17px; }
    .grupo { margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2e8ed; }
    .grupo:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
    label { display: block; margin: 9px 0 4px; font-size: 13px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; border: 1px solid #aebbc5; border-radius: 4px; font: inherit; }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { width: 100%; margin-top: 18px; padding: 10px 12px; border: 0; border-radius: 4px; background: #174a63; color: #fff; cursor: pointer; font-weight: bold; }
    button.secundario { background: #486575; }
    button:disabled { opacity: .55; cursor: wait; }
    .estado { min-height: 20px; margin-top: 12px; color: #4c6270; font-size: 12px; }
    .visor { min-width: 0; padding: 14px; background: #8798a3; border-radius: 6px; overflow: auto; text-align: center; }
    #pagina { position: relative; display: inline-block; max-width: 100%; box-shadow: 0 2px 10px #33404a66; background: #fff; }
    #pdf-canvas { display: block; max-width: 100%; height: auto; }
    .marca { position: absolute; display: none; border: 2px dashed #174a63; background: #ffffffaa; object-fit: contain; pointer-events: none; }
    .nota { margin: 0 0 12px; color: #526572; font-size: 12px; line-height: 1.4; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; } .visor { min-height: 500px; } }
  </style>
</head>
<body>
  <header><h1>IP-800: firma y huella dactilar</h1></header>
  <main>
    <section class="panel">
      <h2>Insertar imágenes</h2>
      <p class="nota">Carga una firma y una huella, selecciona la página y ajusta su posición en la previsualización.</p>
      <div class="grupo">
        <label for="firma">Imagen de firma</label>
        <input id="firma" type="file" accept="image/png,image/jpeg">
        <div class="fila">
          <label>Página<input id="paginaFirma" type="number" min="1" value="1"></label>
          <label>Ancho (pt)<input id="anchoFirma" type="number" min="10" value="130"></label>
        </div>
        <div class="fila">
          <label>Izquierda (pt)<input id="xFirma" type="number" min="0" value="330"></label>
          <label>Arriba (pt)<input id="yFirma" type="number" min="0" value="680"></label>
        </div>
      </div>
      <div class="grupo">
        <label for="huella">Imagen de huella dactilar</label>
        <input id="huella" type="file" accept="image/png,image/jpeg">
        <div class="fila">
          <label>Página<input id="paginaHuella" type="number" min="1" value="1"></label>
          <label>Ancho (pt)<input id="anchoHuella" type="number" min="10" value="55"></label>
        </div>
        <div class="fila">
          <label>Izquierda (pt)<input id="xHuella" type="number" min="0" value="470"></label>
          <label>Arriba (pt)<input id="yHuella" type="number" min="0" value="680"></label>
        </div>
      </div>
      <button id="exportar" type="button">Exportar PDF con firma y huella</button>
      <button class="secundario" type="button" onclick="window.print()">Imprimir previsualización</button>
      <div id="estado" class="estado"></div>
    </section>
    <section class="visor">
      <div id="pagina">
        <canvas id="pdf-canvas"></canvas>
        <img id="marca-firma" class="marca" alt="Vista previa de firma">
        <img id="marca-huella" class="marca" alt="Vista previa de huella">
      </div>
    </section>
  </main>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdfUrl = 'Form%20IP-800%20V5%20pdf%20(2).pdf';
    const canvas = document.getElementById('pdf-canvas');
    const contexto = canvas.getContext('2d');
    const estado = document.getElementById('estado');
    let documentoPdf;
    let paginaActual = 1;
    let escala = 1;
    let firmaData;
    let huellaData;

    function leerImagen(archivo, tipo) {
      if (!archivo) return;
      const lector = new FileReader();
      lector.onload = () => {
        if (tipo === 'firma') { firmaData = lector.result; document.getElementById('marca-firma').src = firmaData; }
        else { huellaData = lector.result; document.getElementById('marca-huella').src = huellaData; }
        actualizarMarcas();
      };
      lector.readAsDataURL(archivo);
    }

    function actualizarMarcas() {
      colocarMarca('firma', 'marca-firma');
      colocarMarca('huella', 'marca-huella');
    }

    function colocarMarca(tipo, id) {
      const marca = document.getElementById(id);
      const datos = tipo === 'firma' ? ['xFirma', 'yFirma', 'anchoFirma', 'paginaFirma'] : ['xHuella', 'yHuella', 'anchoHuella', 'paginaHuella'];
      if (!marca.src || Number(document.getElementById(datos[3]).value) !== paginaActual) { marca.style.display = 'none'; return; }
      const ancho = Number(document.getElementById(datos[2]).value);
      marca.style.display = 'block';
      marca.style.left = `${Number(document.getElementById(datos[0]).value) * escala}px`;
      marca.style.top = `${Number(document.getElementById(datos[1]).value) * escala}px`;
      marca.style.width = `${ancho * escala}px`;
      marca.style.height = 'auto';
    }

    async function mostrarPagina(numero) {
      paginaActual = Math.max(1, Math.min(numero, documentoPdf.numPages));
      const pagina = await documentoPdf.getPage(paginaActual);
      const vista = pagina.getViewport({ scale: 1.35 });
      escala = vista.width / pagina.getViewport({ scale: 1 }).width;
      canvas.width = vista.width;
      canvas.height = vista.height;
      await pagina.render({ canvasContext: contexto, viewport: vista }).promise;
      actualizarMarcas();
      estado.textContent = `Página ${paginaActual} de ${documentoPdf.numPages}`;
    }

    async function cargarPdf() {
      documentoPdf = await pdfjsLib.getDocument(pdfUrl).promise;
      await mostrarPagina(1);
    }

    async function exportarPdf() {
      const boton = document.getElementById('exportar');
      boton.disabled = true;
      estado.textContent = 'Generando PDF...';
      try {
        const respuesta = await fetch(pdfUrl);
        const bytes = await respuesta.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(bytes);
        await agregarImagen(pdf, firmaData, 'paginaFirma', 'xFirma', 'yFirma', 'anchoFirma');
        await agregarImagen(pdf, huellaData, 'paginaHuella', 'xHuella', 'yHuella', 'anchoHuella');
        const salida = await pdf.save();
        const enlace = document.createElement('a');
        enlace.href = URL.createObjectURL(new Blob([salida], { type: 'application/pdf' }));
        enlace.download = 'IP-800-con-firma-y-huella.pdf';
        enlace.click();
        URL.revokeObjectURL(enlace.href);
        estado.textContent = 'PDF exportado correctamente.';
      } catch (error) {
        estado.textContent = 'No se pudo exportar el PDF.';
        console.error(error);
      } finally { boton.disabled = false; }
    }

    async function agregarImagen(pdf, data, paginaId, xId, yId, anchoId) {
      if (!data) return;
      const pagina = pdf.getPages()[Number(document.getElementById(paginaId).value) - 1];
      const imagen = data.startsWith('data:image/png') ? await pdf.embedPng(data) : await pdf.embedJpg(data);
      const ancho = Number(document.getElementById(anchoId).value);
      const alto = ancho * imagen.height / imagen.width;
      pagina.drawImage(imagen, { x: Number(document.getElementById(xId).value), y: pagina.getHeight() - Number(document.getElementById(yId).value) - alto, width: ancho, height: alto });
    }

    document.getElementById('firma').addEventListener('change', (evento) => leerImagen(evento.target.files[0], 'firma'));
    document.getElementById('huella').addEventListener('change', (evento) => leerImagen(evento.target.files[0], 'huella'));
    ['paginaFirma', 'xFirma', 'yFirma', 'anchoFirma', 'paginaHuella', 'xHuella', 'yHuella', 'anchoHuella'].forEach((id) => document.getElementById(id).addEventListener('input', actualizarMarcas));
    document.getElementById('exportar').addEventListener('click', exportarPdf);
    cargarPdf().catch(() => { estado.textContent = 'No se pudo cargar el PDF.'; });
  </script>
</body>
</html>
